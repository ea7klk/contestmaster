<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Contestmaster mockup A: activity feed first</title>
  <desc id="desc">A warm red-brown contest dashboard with top navigation, contest status filters, an activity list, and a visible log submission action.</desc>
  <defs><style>
    text{font-family:Inter,Arial,sans-serif;fill:#282421}.muted{fill:#655b55}.small{font-size:14px}.label{font-size:12px;font-weight:700;letter-spacing:1.4px}.h1{font-size:35px;font-weight:750;letter-spacing:-1px}.h2{font-size:20px;font-weight:700}.body{font-size:16px}.tiny{font-size:12px}.button{font-size:14px;font-weight:700}
  </style></defs>
  <rect width="1440" height="900" fill="#f7f0ec"/>
  <rect width="1440" height="76" fill="#511e20"/>
  <path d="M31 24h24M31 31h24M31 38h24" stroke="#fffdfa" stroke-width="2.5" stroke-linecap="round"/>
  <text x="72" y="45" fill="#fffdfa" font-size="23" font-weight="750">Contestmaster</text>
  <text x="280" y="45" fill="#e7d8cf" font-size="14" font-weight="700">Contests</text>
  <text x="385" y="45" fill="#fffdfa" font-size="14" font-weight="700">Results</text>
  <text x="470" y="45" fill="#e7d8cf" font-size="14" font-weight="700">About</text>
  <rect x="1153" y="18" width="150" height="40" rx="7" fill="#fffdfa"/><text x="1182" y="43" class="button" fill="#511e20">Submit a log</text>
  <text x="1325" y="44" fill="#fffdfa" font-size="14" font-weight="700">Sign in</text>
  <text x="120" y="132" class="label" fill="#a33c3d">ON THE AIR · CONTEST ACTIVITY</text>
  <text x="120" y="180" class="h1">Find a contest. Make your next contact.</text>
  <text x="120" y="212" class="body muted">Browse current events, check the rules, then upload your log when you are done.</text>
  <rect x="1100" y="146" width="220" height="48" rx="8" fill="#7d292b"/><text x="1146" y="176" class="button" fill="#fffdfa">＋ Submit a log</text>
  <rect x="120" y="245" width="1200" height="72" rx="10" fill="#fffdfa" stroke="#ded2c9"/>
  <text x="146" y="275" class="label" fill="#655b55">SEARCH CONTESTS</text>
  <text x="146" y="299" class="body muted">Name, mode, or callsign</text><path d="M450 263v36" stroke="#ded2c9" stroke-width="2"/>
  <text x="480" y="275" class="label" fill="#655b55">WHEN</text><text x="480" y="299" class="body">All dates</text>
  <path d="M700 263v36" stroke="#ded2c9" stroke-width="2"/><text x="730" y="275" class="label" fill="#655b55">MODE</text><text x="730" y="299" class="body">Any mode</text>
  <rect x="1155" y="258" width="142" height="46" rx="7" fill="#7d292b"/><text x="1201" y="286" class="button" fill="#fffdfa">Search</text>
  <text x="120" y="372" class="h2">Contest activity</text><text x="305" y="371" class="small muted">Updated just now</text>
  <rect x="120" y="394" width="78" height="35" rx="18" fill="#7d292b"/><text x="138" y="416" class="small" fill="#fffdfa" font-weight="700">Current</text>
  <text x="220" y="416" class="small muted">Upcoming</text><text x="320" y="416" class="small muted">Recently completed</text>
  <text x="1160" y="416" class="small" fill="#7d292b" font-weight="700">▤ Table view</text>
  <rect x="120" y="445" width="1200" height="104" rx="10" fill="#fffdfa" stroke="#ded2c9"/>
  <rect x="120" y="445" width="7" height="104" rx="4" fill="#a33c3d"/>
  <text x="152" y="476" class="label" fill="#a33c3d">CW · HF · WORLDWIDE</text><text x="152" y="510" class="h2">Autumn DX Challenge</text>
  <text x="650" y="482" class="small muted">STARTS</text><text x="650" y="509" class="body">14:00 UTC · 18 Oct</text>
  <text x="885" y="482" class="small muted">ENDS</text><text x="885" y="509" class="body">14:00 UTC · 19 Oct</text>
  <rect x="1121" y="474" width="154" height="42" rx="7" fill="#f7f0ec" stroke="#ded2c9"/><text x="1156" y="501" class="button" fill="#511e20">View contest →</text>
  <rect x="120" y="565" width="1200" height="104" rx="10" fill="#fffdfa" stroke="#ded2c9"/>
  <rect x="120" y="565" width="7" height="104" rx="4" fill="#ce6a54"/>
  <text x="152" y="596" class="label" fill="#a33c3d">DIGITAL · RTTY</text><text x="152" y="630" class="h2">Worldwide Digital Weekend</text>
  <text x="650" y="602" class="small muted">STARTS</text><text x="650" y="629" class="body">18:00 UTC · 24 Oct</text>
  <text x="885" y="602" class="small muted">ENDS</text><text x="885" y="629" class="body">18:00 UTC · 25 Oct</text>
  <rect x="1121" y="594" width="154" height="42" rx="7" fill="#f7f0ec" stroke="#ded2c9"/><text x="1156" y="621" class="button" fill="#511e20">View contest →</text>
  <text x="120" y="726" class="small muted">PUBLIC RESULTS ARE AVAILABLE WITHOUT AN ACCOUNT.</text>
  <path d="M120 754h1200" stroke="#ded2c9"/>
  <text x="120" y="784" class="tiny muted">Contestmaster · Amateur radio contest engine</text>
  <text x="120" y="808" class="tiny muted">Reference datasets: cty.dat · UNGEGN · United Nations M49 standard and terms</text>
  <text x="120" y="847" class="tiny" fill="#a33c3d" font-weight="700">MOCKUP A · ACTIVITY FEED FIRST</text>
</svg>
