<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Contestmaster mockup C: results table first</title>
  <desc id="desc">A published standings page with contest selection, category filters, score explanation, and a dense accessible table.</desc>
  <defs><style>text{font-family:Inter,Arial,sans-serif;fill:#282421}.muted{fill:#655b55}.small{font-size:14px}.label{font-size:12px;font-weight:700;letter-spacing:1.4px}.h1{font-size:34px;font-weight:750;letter-spacing:-1px}.h2{font-size:19px;font-weight:700}.body{font-size:15px}.tiny{font-size:12px}.button{font-size:14px;font-weight:700}</style></defs>
  <rect width="1440" height="900" fill="#f6f1eb"/><rect width="1440" height="76" fill="#55271f"/>
  <path d="M31 24h24M31 31h24M31 38h24" stroke="#fffdfa" stroke-width="2.5" stroke-linecap="round"/><text x="72" y="45" fill="#fffdfa" font-size="23" font-weight="750">Contestmaster</text>
  <text x="280" y="45" fill="#e7d8cf" font-size="14" font-weight="700">Contests</text><text x="385" y="45" fill="#fffdfa" font-size="14" font-weight="700">Results</text><text x="470" y="45" fill="#e7d8cf" font-size="14" font-weight="700">About</text>
  <rect x="1153" y="18" width="150" height="40" rx="7" fill="#fffdfa"/><text x="1182" y="43" class="button" fill="#55271f">Submit a log</text><text x="1325" y="44" fill="#fffdfa" font-size="14" font-weight="700">Sign in</text>
  <text x="120" y="132" class="label" fill="#914a37">PUBLISHED STANDINGS</text><text x="120" y="178" class="h1">Autumn DX Challenge</text><text x="120" y="210" class="body muted">Final results · Published 20 October 2026 at 16:40 UTC</text>
  <rect x="120" y="243" width="1200" height="86" rx="9" fill="#fffdfa" stroke="#ded2c9"/>
  <text x="146" y="272" class="label" fill="#655b55">CONTEST</text><text x="146" y="304" class="body" font-weight="700">Autumn DX Challenge  ▾</text>
  <path d="M490 260v52" stroke="#ded2c9" stroke-width="2"/><text x="521" y="272" class="label" fill="#655b55">CATEGORY</text><text x="521" y="304" class="body" font-weight="700">All categories  ▾</text>
  <path d="M810 260v52" stroke="#ded2c9" stroke-width="2"/><text x="840" y="272" class="label" fill="#655b55">SEARCH CALLSIGN</text><text x="840" y="304" class="body muted">e.g. DL1ABC</text>
  <rect x="1125" y="263" width="164" height="48" rx="7" fill="#77382b"/><text x="1163" y="293" class="button" fill="#fffdfa">Download results</text>
  <rect x="120" y="352" width="1200" height="100" rx="9" fill="#f0e4da"/><circle cx="161" cy="402" r="18" fill="#77382b"/><text x="155" y="408" fill="#fffdfa" font-size="17" font-weight="700">i</text>
  <text x="195" y="390" class="h2">How the final score is built</text><text x="195" y="418" class="small muted">Points: 1 per valid QSO · Multipliers: unique entities per band · Claimed QSOs are checked against submitted logs.</text><text x="195" y="439" class="small" fill="#77382b" font-weight="700">Read the published ruleset →</text>
  <text x="120" y="495" class="h2">Overall results</text><text x="285" y="494" class="small muted">128 entries · sorted by final score</text><text x="1166" y="494" class="small" fill="#77382b" font-weight="700">↕ Sort results</text>
