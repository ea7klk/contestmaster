  <rect x="120" y="676" width="1200" height="54" fill="#fffdfa"/><text x="156" y="710" class="body" font-weight="700">3</text><text x="245" y="710" class="body" fill="#77382b" font-weight="700">W4QSO</text><text x="484" y="710" class="body">Single operator · Low</text><text x="704" y="710" class="body">702</text><text x="842" y="710" class="body">163</text><text x="1063" y="710" class="body" font-weight="700">114,426</text><path d="M120 730h1200" stroke="#ded2c9"/>
  <rect x="120" y="731" width="1200" height="54" fill="#fffdfa"/><text x="156" y="765" class="body" font-weight="700">4</text><text x="245" y="765" class="body" fill="#77382b" font-weight="700">JA1RST</text><text x="484" y="765" class="body">Single operator · High</text><text x="704" y="765" class="body">655</text><text x="842" y="765" class="body">151</text><text x="1063" y="765" class="body" font-weight="700">98,955</text>
  <path d="M120 815h1200" stroke="#ded2c9"/><text x="120" y="845" class="tiny muted">Contestmaster · Published results are public · Licensed dataset attributions and terms</text>
  <text x="120" y="878" class="tiny" fill="#914a37" font-weight="700">MOCKUP C · RESULTS TABLE FIRST</text>
