<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">Proposed ruleset review and validation screen</title>
  <desc id="desc">A proposed review screen with grouped expandable rule summaries, source provenance, validation feedback, and a score example.</desc>
  <defs><style>.ink{fill:#282421;font-family:Inter,Arial,sans-serif}.muted{fill:#655b55;font-family:Inter,Arial,sans-serif}.tiny{font-size:14px}.small{font-size:16px}.body{font-size:18px}.h2{font-size:24px;font-weight:700}.h1{font-size:34px;font-weight:750}.bold{font-weight:700}.white{fill:#fffdfa;font-family:Inter,Arial,sans-serif}.brand{fill:#511e20}.brand2{fill:#7d292b}.card{fill:#fffdfa;stroke:#ded2c9;stroke-width:2}.soft{fill:#f0e6df}.green{fill:#e8f5ed}.greenInk{fill:#23573d;font-family:Inter,Arial,sans-serif}.line{stroke:#ded2c9;stroke-width:2}</style></defs>
  <rect width="1440" height="960" fill="#f7f0ec"/><rect width="1440" height="78" class="brand"/>
  <text x="38" y="49" class="white" font-size="24" font-weight="750">☰　CONTESTMASTER</text><text x="1120" y="48" class="white small">Contest manager　⌄</text>
  <text x="42" y="126" class="brand2 tiny bold" letter-spacing="2">REVIEW BEFORE SAVING</text><text x="42" y="172" class="ink h1">Review your ruleset</text><text x="42" y="205" class="muted body">Confirm the sponsor rules are represented correctly. Change any section without losing your work.</text>

  <rect x="42" y="238" width="878" height="88" rx="14" class="card"/><text x="72" y="275" class="ink body bold">Spring Sprint</text><text x="72" y="302" class="muted small">Version 2026　·　Published rules linked　·　Source edition recorded</text><rect x="770" y="258" width="114" height="38" rx="19" class="green"/><text x="796" y="283" class="greenInk small bold">Ready to validate</text>

  <rect x="42" y="350" width="878" height="92" rx="14" class="card"/><circle cx="82" cy="396" r="19" class="green"/><text x="76" y="402" class="greenInk bold">✓</text><text x="116" y="387" class="ink body bold">Entrant categories &amp; exchange</text><text x="116" y="416" class="muted small">Single operator · low/high power · serial exchange in both directions</text><text x="866" y="404" class="brand2 body bold">Edit　⌄</text>
  <rect x="42" y="456" width="878" height="108" rx="14" class="card"/><circle cx="82" cy="510" r="19" class="green"/><text x="76" y="516" class="greenInk bold">✓</text><text x="116" y="493" class="ink body bold">Logs &amp; contact eligibility</text><text x="116" y="522" class="muted small">Cabrillo accepted · 20m/40m · CW and SSB · UTC contest period</text><text x="116" y="546" class="muted tiny">Duplicate contacts earn no points; eligible new multipliers are retained.</text><text x="866" y="516" class="brand2 body bold">Edit　⌄</text>
  <rect x="42" y="578" width="878" height="108" rx="14" class="card"/><circle cx="82" cy="632" r="19" class="green"/><text x="76" y="638" class="greenInk bold">✓</text><text x="116" y="615" class="ink body bold">Scoring</text><text x="116" y="644" class="muted small">1 point per eligible QSO · entity multiplier once per band</text><text x="116" y="668" class="muted tiny">Integer formula: QSO points × multipliers + bonus − penalties</text><text x="866" y="638" class="brand2 body bold">Edit　⌄</text>
  <rect x="42" y="700" width="878" height="92" rx="14" class="card"/><circle cx="82" cy="746" r="19" class="green"/><text x="76" y="752" class="greenInk bold">✓</text><text x="116" y="737" class="ink body bold">Operating limits &amp; review</text><text x="116" y="766" class="muted small">8 operating hours · ambiguous cross-log matches require review</text><text x="866" y="754" class="brand2 body bold">Edit　⌄</text>
  <rect x="42" y="812" width="878" height="96" rx="14" class="soft"/><text x="72" y="849" class="ink small bold">Advanced settings (3)</text><text x="72" y="879" class="muted tiny">Stable rule IDs · condition expressions · detailed format mappings · review hooks</text><text x="866" y="866" class="brand2 body bold">Show　⌄</text>

  <rect x="948" y="238" width="450" height="260" rx="16" class="card"/><text x="980" y="280" class="ink" font-size="21" font-weight="700">Validation</text><rect x="980" y="302" width="386" height="56" rx="10" class="brand2"/><text x="1105" y="338" class="white small bold">Validate all rules</text><text x="980" y="391" class="greenInk small bold">✓ Required rules present</text><text x="980" y="423" class="greenInk small bold">✓ Formats match configured exchanges</text><text x="980" y="455" class="greenInk small bold">✓ No contradictory settings</text><text x="980" y="481" class="muted tiny">Validation is authoritative on the server.</text>
  <rect x="948" y="520" width="450" height="220" rx="16" class="card"/><text x="980" y="563" class="ink" font-size="21" font-weight="700">Worked score example</text><text x="980" y="599" class="muted small">Example values, not an entrant prediction</text><text x="980" y="642" class="ink body">120 QSO points × 8 multipliers</text><text x="980" y="676" class="ink body">+ 10 bonus − 5 penalty</text><path d="M980 692h386" class="line"/><text x="980" y="725" class="brand2" font-size="22" font-weight="750">= 965 points</text>
  <rect x="948" y="762" width="450" height="146" rx="16" fill="#f8ece7" stroke="#c69d91" stroke-width="2"/><text x="980" y="805" class="ink small bold">Still complete and traceable</text><text x="980" y="835" class="muted tiny">Every current criterion remains available. The full</text><text x="980" y="858" class="muted tiny">JSON draft and advanced controls remain accessible.</text><text x="980" y="884" class="brand2 tiny bold">Save creates a new immutable version.</text>
  <rect x="42" y="922" width="210" height="30" rx="8" class="brand2"/><text x="75" y="943" class="white small bold">Save validated version</text><text x="274" y="943" class="muted tiny">Enabled only after a successful validation.</text>
</svg>
