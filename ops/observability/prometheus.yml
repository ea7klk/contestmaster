global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/contestmaster-alert-rules.yml

scrape_configs:
  - job_name: contestmaster
    metrics_path: /internal/metrics
    scrape_timeout: 10s
    bearer_token_file: /run/secrets/contestmaster-metrics-token
    static_configs:
      - targets:
          - 127.0.0.1:8000
        labels:
          service: contestmaster
