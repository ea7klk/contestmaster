[project]
name = "contestmaster-api"
version = "0.1.0"
description = "REST API for the Contestmaster amateur radio contest engine"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "COPYRIGHT"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
contestmaster-master-data = "backend.app.master_data.cli:main"
contestmaster-admin = "backend.app.identity_cli:main"

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
